##add base_config validations here and use tag base to run on it's own

  - name: Gather ntp Summary
    eos_command: 
      commands: 'show ntp associations | json'
    register: ntp_output
    tags:
      - base

  - name: Validate base config is deployed correctly
    assert:
      that: " ntp_output.stdout[0].peers | length  >= 1"
    tags:
      - base

  - name: Gather DNS Summary
    eos_command: 
      commands: 'show ip name-server | json'
    register: dns_output
    tags:
      - base

  - name: Validate dns config is deployed correctly
    assert:
      that: " dns_output.stdout[0].v4NameServers | length  >= 2"
    tags:
      - base

  - name: Gather Routing Summary
    eos_command: 
      commands: 'show ip route vrf mgmt | json'
    register: routing_output
    tags:
      - base
  
  - name: Validate default route is present in mgmt vrf
    assert:
        that:
        - "routing_output.stdout[0].vrfs.mgmt.routes['0.0.0.0/0'] is defined"
        - "routing_output.stdout[0].vrfs.mgmt.routes['0.0.0.0/0'].nexthopAddr == '192.168.8.2'"
    tags:
      - base